name: CuevaCoin static verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  static-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Verify HTML inline scripts and CuevaCoin invariants
        run: node scripts/verify-cuevacoin-static.mjs
