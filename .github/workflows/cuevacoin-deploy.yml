name: CuevaCoin governed Worker deployment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cuevacoin-deploy.yml"
      - ".assetsignore"
      - "wrangler.jsonc"
      - "index.html"
      - "service-worker.js"
      - "js/**"
      - "scripts/verify-cuevacoin-*.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      change_summary:
        description: "Required summary of the authorized production change"
        required: true
        type: string
      confirm_project_ref:
        description: "Type the exact CuevaCoin Supabase project ref to confirm target identity"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cuevacoin-production-deploy
  cancel-in-progress: false

jobs:
  validate-only:
    name: Validate deploy path (no production writes)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 15
    steps:
      - name: Checkout pull request for validation only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check exact Worker identity and asset target
        run: node scripts/verify-cuevacoin-worker-target.mjs

      - name: Validate bundle without production credentials
        run: npx.cmd --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Verify LIVE route health and reject leaked internal assets (release parity is checked after deploy)
        run: node scripts/verify-cuevacoin-live-assets.mjs

  deploy-worker:
    name: Deploy and verify CuevaCoin Worker
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 20
    environment: cuevacoin-production
    steps:
      - name: Checkout the exact dispatched main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate target, config, and credentials without printing them
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CHANGE_SUMMARY: ${{ inputs.change_summary }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUEVACOIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CUEVACOIN_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-cuevacoin-production-deploy-gate.mjs

      - name: Validate Worker deployment bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUEVACOIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CUEVACOIN_CLOUDFLARE_ACCOUNT_ID }}
        run: npx.cmd --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Deploy CuevaCoin Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUEVACOIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CUEVACOIN_CLOUDFLARE_ACCOUNT_ID }}
        run: npx.cmd --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify LIVE frontend exactly matches the deployed source
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-cuevacoin-release-parity.mjs

# Supabase Edge Functions are intentionally not deployed from GitHub Actions.
# ARIA must inspect/deploy them separately through the fixed-project,
# project-scoped cuevacoin_project_control operation. Never copy the
# Supabase Management token into GitHub Actions secrets.
