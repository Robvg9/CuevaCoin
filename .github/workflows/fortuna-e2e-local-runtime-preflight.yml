name: FORTUNA local E2E runtime preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fortuna-e2e-local-runtime-preflight.yml"
      - "scripts/fortuna-local-runtime-preflight.mjs"

permissions:
  contents: read

concurrency:
  group: fortuna-local-runtime-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-host-preflight:
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect local Supabase prerequisites without starting services
        shell: cmd
        run: node scripts/fortuna-local-runtime-preflight.mjs
