name: FORTUNA LIVE JWT gateway smoke

on:
  push:
    branches: [feat/fortuna-live-jwt-smoke]

permissions:
  contents: read

concurrency:
  group: fortuna-live-jwt-smoke
  cancel-in-progress: true

jobs:
  live-jwt-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify LIVE endpoint rejects missing and malformed user JWTs
        run: node scripts/smoke-fortuna-dispatch-auth.mjs
