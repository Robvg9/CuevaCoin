name: Generate FORTUNA history migration scaffold

on:
  push:
    branches:
      - "feat/fortuna-ui/**"
    paths:
      - ".github/workflows/fortuna-migration-generation.yml"

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Generate the migration with Supabase CLI
        shell: bash
        run: |
          supabase migration new fortuna_owner_activity_history
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_fortuna_owner_activity_history.sql' | sort | tail -n 1)"
          test -n "$generated"
          printf 'Generated migration: %s\n' "$generated"
          rm .github/workflows/fortuna-migration-generation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$generated" .github/workflows/fortuna-migration-generation.yml
          git commit -m "chore(fortuna): generate owner activity history migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
