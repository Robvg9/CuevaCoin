name: FORTUNA Edge Dispatcher contract

on:
  # Public-repo safety: self-hosted Windows jobs must not run fork PR code.
  push:
    branches: [main, "feat/**"]
    paths:
      - "supabase/functions/fortuna-dispatch/**"
      - "scripts/verify-fortuna-edge-dispatch.mjs"
      - "scripts/smoke-fortuna-dispatch-auth.mjs"
      - "docs/fortuna/edge-dispatcher.md"
      - ".github/workflows/fortuna-edge-dispatcher.yml"

permissions:
  contents: read

concurrency:
  group: fortuna-edge-dispatcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-dispatcher-contract:
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify dispatcher rejects missing and malformed user JWTs
        run: node scripts/smoke-fortuna-dispatch-auth.mjs
        shell: cmd
      - name: Verify user-JWT dispatcher security contract
        run: node scripts/verify-fortuna-edge-dispatch.mjs
        shell: cmd
