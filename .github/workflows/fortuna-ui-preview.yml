name: FORTUNA owner UI integration contract

on:
  # Trusted branch pushes only. Never execute public fork code on a self-hosted runner.
  push:
    branches:
      - "feat/fortuna-ui/**"
    paths:
      - "index.html"
      - "js/finance/fortuna/**"
      - "js/ui/navigation.js"
      - "js/finance/orchestration/show-admin-panel.js"
      - "js/finance/orchestration/show-user-dashboard.js"
      - "js/session/logout.js"
      - "service-worker.js"
      - "supabase/functions/fortuna-dispatch/index.ts"
      - "scripts/verify-fortuna-ui-preview.mjs"
      - "scripts/verify-fortuna-api-client.mjs"
      - "scripts/e2e-fortuna-authenticated.mjs"
      - ".github/workflows/fortuna-authenticated-e2e.yml"
      - "scripts/verify-step10-release.mjs"
      - "scripts/verify-transfer-recipient-security.mjs"
      - "scripts/verify-v156-navigation-ui.mjs"
      - "scripts/verify-admin-payroll-history.mjs"
      - "scripts/verify-p1-01-xss.mjs"
      - "scripts/verify-v149-users-ui.mjs"
      - "scripts/verify-password-recovery.mjs"
      - "docs/fortuna/FORTUNA_UI_PREVIEW_V1.md"
      - ".github/workflows/fortuna-ui-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "js/finance/fortuna/**"
      - "js/ui/navigation.js"
      - "js/finance/orchestration/show-admin-panel.js"
      - "js/finance/orchestration/show-user-dashboard.js"
      - "js/session/logout.js"
      - "service-worker.js"
      - "supabase/functions/fortuna-dispatch/index.ts"
      - "scripts/verify-fortuna-ui-preview.mjs"
      - "scripts/verify-fortuna-api-client.mjs"
      - "scripts/verify-step10-release.mjs"
      - "docs/fortuna/FORTUNA_UI_PREVIEW_V1.md"
      - ".github/workflows/fortuna-ui-preview.yml"
      - "scripts/e2e-fortuna-authenticated.mjs"
      - ".github/workflows/fortuna-authenticated-e2e.yml"

permissions:
  contents: read

concurrency:
  group: fortuna-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check browser modules
        run: |
          node --check js/finance/fortuna/ui.js
          node --check js/finance/fortuna/api.mjs
          node --check js/finance/fortuna/preview-domain.mjs
          node --check scripts/e2e-fortuna-authenticated.mjs
      - name: Verify FORTUNA owner UI contract
        run: node scripts/verify-fortuna-ui-preview.mjs
      - name: Verify authenticated API client
        run: node scripts/verify-fortuna-api-client.mjs
      - name: Verify Step 10 release contract
        run: node scripts/verify-step10-release.mjs
      - name: Verify Cloudflare Worker build gates without deployment
        run: |
          node scripts/verify-password-recovery.mjs
          node scripts/verify-step10-release.mjs
          node scripts/verify-v149-users-ui.mjs
          node scripts/verify-p1-01-xss.mjs
          node scripts/verify-admin-payroll-history.mjs
          node scripts/verify-v156-navigation-ui.mjs
          node scripts/verify-transfer-recipient-security.mjs
