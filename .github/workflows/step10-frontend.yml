name: CuevaCoin Step 10 atomic UI verification

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "js/legacy-app.js"
      - "js/core/app.js"
      - "js/core/utils.js"
      - "js/auth/login-hardening.js"
      - "js/finance/history/historial.js"
      - "js/finance/queue/offline-queue.js"
      - "js/admin/finance/historial-trabajadora.js"
      - "js/admin/finance/pagos.js"
      - "js/admin/finance/usuarios.js"
      - "service-worker.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-step10-release.mjs"
      - ".github/workflows/step10-frontend.yml"
  push:
    branches:
      - "main"
      - "fix/**"
    paths:
      - "index.html"
      - "js/legacy-app.js"
      - "js/core/app.js"
      - "js/core/utils.js"
      - "js/auth/login-hardening.js"
      - "js/finance/history/historial.js"
      - "js/finance/queue/offline-queue.js"
      - "js/admin/finance/historial-trabajadora.js"
      - "js/admin/finance/pagos.js"
      - "js/admin/finance/usuarios.js"
      - "service-worker.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-step10-release.mjs"
      - ".github/workflows/step10-frontend.yml"

permissions:
  contents: read

jobs:
  atomic-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify atomic financial UI and release assets
        run: node scripts/verify-step10-release.mjs
