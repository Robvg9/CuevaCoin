name: CuevaCoin Step 10 atomic UI verification

on:
  # Public-repo safety: self-hosted Windows jobs must not run fork PR code.
  push:
    branches:
      - "main"
      - "fix/**"
    paths:
      - "supabase/functions/transferir-saldo/**"
      - "supabase/functions/fortuna-dispatch/**"
      - "scripts/verify-fortuna-edge-dispatch.mjs"

      - "supabase/functions/resolver-cuenta-qr/**"

      - "supabase/functions/resolver-cuenta-usuario/**"

      - "js/finance/transfers/**"

      - "js/finance/withdrawals/admin-retiros.js"

      - "scripts/verify-transfer-recipient-security.mjs"
      - "index.html"
      - "js/finance/fortuna/**"
      - "js/ui/navigation.js"
      - "scripts/verify-fortuna-ui-preview.mjs"
      - "js/legacy-app.js"
      - "js/core/app.js"
      - "js/core/utils.js"
      - "js/auth/login-hardening.js"
      - "js/auth/password-recovery.js"
      - "supabase/functions/recuperar-contrasena/**"
      - "supabase/functions/cuevacoin-login/**"
      - "scripts/verify-password-recovery.mjs"
      - "js/finance/history/historial.js"
      - "js/chat/**"
      - "js/ui/notif-panel.js"
      - "js/ui/menu-dots.js"
      - "js/data/notifications.js"
      - "scripts/verify-v156-navigation-ui.mjs"
      - "js/ui/sugerencias-user.js"
      - "js/profile/qr-display.js"
      - "js/admin/correo-lista.js"
      - "js/admin/sugerencias-admin.js"
      - "js/admin/finance/destinatarios.js"
      - "js/admin/finance/historial-general.js"
      - "scripts/verify-admin-payroll-history.mjs"
      - "supabase/tests/admin_payroll_batch_atomicity.sql"
      - "js/admin/finance/auditoria.js"
      - "js/admin/finance/reportes.js"
      - "js/finance/transfers/favoritos.js"
      - "js/finance/withdrawals/admin-solicitudes-ui.js"
      - "scripts/verify-p1-01-xss.mjs"
      - "js/finance/queue/offline-queue.js"
      - "js/admin/finance/historial-trabajadora.js"
      - "js/admin/finance/stats.js"
      - "js/finance/orchestration/show-admin-panel.js"
      - "js/finance/orchestration/show-user-dashboard.js"
      - "js/session/logout.js"
      - "scripts/verify-v149-users-ui.mjs"
      - "wrangler.jsonc"
      - "js/admin/finance/pagos.js"
      - "js/admin/finance/usuarios.js"
      - "js/admin/trabajadoras.js"
      - "js/admin/usuarios-estado.js"
      - "js/data/profiles.js"
      - "js/finance/orchestration/procesar-sesion.js"
      - "service-worker.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-step10-release.mjs"
      - "scripts/verify-fortuna-ledger-contract.mjs"
      - "scripts/verify-fortuna-postgres-schema.mjs"
      - "scripts/verify-fortuna-transaction-atomicity.mjs"
      - "scripts/verify-fortuna-settlement-operations.mjs"
      - "scripts/verify-fortuna-owner-rls.mjs"
      - "scripts/verify-fortuna-api-boundary.mjs"
      - "scripts/verify-fortuna-owner-api-operations.mjs"
      - "scripts/verify-fortuna-owner-settlement-api.mjs"
      - "docs/fortuna/**"
      - ".github/workflows/step10-frontend.yml"

permissions:
  contents: read

concurrency:
  group: cuevacoin-step10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-ui:
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify password recovery and startup connectivity regression
        run: node scripts/verify-password-recovery.mjs
        shell: cmd
      - name: Verify atomic financial UI and release assets
        run: node scripts/verify-step10-release.mjs
        shell: cmd
      - name: Verify V148 offline behavior and V149 compact admin users list
        run: node scripts/verify-v149-users-ui.mjs
        shell: cmd
      - name: Verify P1-01 safe DOM rendering for untrusted profile and history data
        run: node scripts/verify-p1-01-xss.mjs
        shell: cmd
      - name: Verify salary batches, global history and paginated audit
        run: node scripts/verify-admin-payroll-history.mjs
        shell: cmd
      - name: Verify V156 header, unread badge, and responsive UI
        run: node scripts/verify-v156-navigation-ui.mjs
        shell: cmd
      - name: Verify V158 compact icon-first actions
        run: node scripts/verify-v158-compact-ui.mjs
        shell: cmd
      - name: Verify recipient-ID privacy and active-admin withdrawal guards
        run: node scripts/verify-transfer-recipient-security.mjs
        shell: cmd
      - name: Verify FORTUNA Edge Dispatcher user-JWT security contract
        run: node scripts/verify-fortuna-edge-dispatch.mjs
        shell: cmd
      - name: Install isolated PGlite test runtime (test-only dependency)
        run: |
          if not exist "%RUNNER_TEMP%\fortuna-pglite" mkdir "%RUNNER_TEMP%\fortuna-pglite"
          cd /d "%RUNNER_TEMP%\fortuna-pglite"
          echo {"private":true,"type":"module"}>package.json
          npm install --no-audit --no-fund --save-exact @electric-sql/pglite@0.4.6
        shell: cmd
      - name: Verify FORTUNA schema and constraints in isolated PostgreSQL 17
        run: |
          copy /Y scripts\verify-fortuna-postgres-schema.mjs "%RUNNER_TEMP%\fortuna-pglite\verify.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify.mjs"
        shell: cmd
      - name: Verify FORTUNA FIFO, manual allocations and confirmed overages in isolated PostgreSQL 17
        run: |
          copy /Y scripts\verify-fortuna-settlement-operations.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-settlement.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_SETTLEMENT_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_settlement_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-settlement.mjs"
        shell: cmd
      - name: Verify FORTUNA transaction atomicity and idempotency in isolated PostgreSQL 17
        run: |
          copy /Y scripts\verify-fortuna-transaction-atomicity.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-transactions.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_TRANSACTION_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_transaction_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-transactions.mjs"
        shell: cmd
      - name: Verify FORTUNA API/private schema boundary (local claims simulation)
        run: |
          copy /Y scripts\verify-fortuna-api-boundary.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-api-boundary.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_API_BOUNDARY_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_api_boundary_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-api-boundary.mjs"
        shell: cmd
      - name: Verify FORTUNA owner-only core API operations (local claims simulation)
        run: |
          copy /Y scripts\verify-fortuna-owner-api-operations.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-owner-api-operations.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_OPERATIONS_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_owner_api_operations_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-owner-api-operations.mjs"
        shell: cmd
      - name: Verify FORTUNA owner settlement preview/confirm and stale protection (local claims simulation)
        run: |
          copy /Y scripts\verify-fortuna-owner-settlement-api.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-owner-settlement-api.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_OPERATIONS_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_owner_api_operations_prototype.sql"
          set "FORTUNA_SETTLEMENT_API_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_owner_settlement_api_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-owner-settlement-api.mjs"
        shell: cmd
      - name: Verify FORTUNA owner-only RLS isolation (local claims simulation)
        run: |
          copy /Y scripts\verify-fortuna-owner-rls.mjs "%RUNNER_TEMP%\fortuna-pglite\verify-owner-rls.mjs"
          set "FORTUNA_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_schema_prototype.sql"
          set "FORTUNA_RLS_SQL_FILE=%GITHUB_WORKSPACE%\supabase\tests\fortuna_v1_owner_rls_prototype.sql"
          node "%RUNNER_TEMP%\fortuna-pglite\verify-owner-rls.mjs"
        shell: cmd
      - name: Verify MISIÓN FORTUNA v1 accounting contract (pure model)
        run: node scripts/verify-fortuna-ledger-contract.mjs
        shell: cmd
