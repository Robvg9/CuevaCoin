name: CuevaCoin Step 10 SQL safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-step10-migration.mjs"
      - ".github/workflows/step10-sql-safety.yml"
  push:
    branches:
      - "main"
      - "fix/**"
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-step10-migration.mjs"
      - ".github/workflows/step10-sql-safety.yml"

permissions:
  contents: read

concurrency:
  group: cuevacoin-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-invariants:
    runs-on: [self-hosted, Windows, X64, cuevacoin]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Step 10 SQL security invariants
        run: node scripts/verify-step10-migration.mjs
        shell: cmd
